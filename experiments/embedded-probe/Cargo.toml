[package]
name = "ironwood-embedded-probe"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]
resolver = "3"

[dependencies]
pczt = { path = "../../upstream/librustzcash/pczt", default-features = false, features = ["orchard"] }
orchard = { version = "=0.15.3", default-features = false }
zcash_protocol = { path = "../../upstream/librustzcash/components/zcash_protocol", default-features = false }
zcash_note_encryption = { version = "=0.4.1", default-features = false }
