name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: project-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test verification evidence and failure handling
        run: python3 scripts/check.py project
