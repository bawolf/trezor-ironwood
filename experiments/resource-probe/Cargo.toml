[package]
name = "resource-probe"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]
resolver = "3"

[dependencies]
ironwood-approval = { path = "../../crates/approval", default-features = false }
orchard = { version = "=0.15.3", default-features = false }
rand_chacha = { version = "=0.3.1", default-features = false }
rand_core = { version = "=0.6.4", default-features = false }

pczt = { path = "../../upstream/librustzcash/pczt", default-features = false, features = ["orchard"] }

serde = { version = "=1.0.228", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "=1.0.145", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
